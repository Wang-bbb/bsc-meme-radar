name: Deploy BSC Meme Radar Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 18f21bcc2697986228ed890445cc7d0a
          command: deploy --config wrangler.jsonc

      - name: Verify deployed Worker health and wash-trading gate
        run: |
          node --input-type=module <<'NODE'
          const base = "https://younbsc-meme-radar.zimicui9.workers.dev";
          async function readJson(path) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(45000) });
            const body = await response.json();
            if (!response.ok || body?.ok !== true) {
              throw new Error(path + " returned HTTP " + response.status + " or ok=false");
            }
            return body;
          }
          const health = await readJson("/health");
          if (health.worker !== "running" || health.chain !== "BSC") {
            throw new Error("Deployed Worker health payload is unexpected");
          }
          // Cloudflare edge propagation can lag behind the successful upload.
          // Retry until the exact policy version is visible before asserting runtime behavior.
          let scan = null;
          let lastKeys = [];
          for (let attempt = 1; attempt <= 6; attempt += 1) {
            scan = await readJson("/scan?minutes=15&minLiquidity=5000");
            lastKeys = Object.keys(scan || {});
            if (scan.watchlistPolicyVersion === "priority-watchlist-v3-wallet-quality-gate") break;
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          if (scan.watchlistPolicyVersion !== "priority-watchlist-v3-wallet-quality-gate") {
            throw new Error("Expected wallet-quality policy not visible after deployment propagation; response keys: " + lastKeys.join(","));
          }
          if (!Array.isArray(scan.pools) || !Array.isArray(scan.priorityWatchlist)) {
            throw new Error("BSC scan response is missing pool/watchlist arrays");
          }
          for (const pool of scan.priorityWatchlist) {
            if (pool.walletFlowQualityStatus !== "pass") {
              throw new Error("Priority watchlist contains a pool without wallet-quality pass");
            }
          }
          const inspection = scan.walletFlowInspection;
          if (!inspection || Number(inspection.maxPoolsPerScan) !== 5) {
            throw new Error("Wallet-flow inspection cap is missing or unexpected; response keys: " + lastKeys.join(","));
          }
          console.log("Worker health: passed");
          console.log("BSC scan runtime: passed");
          console.log("Pools:", scan.pools.length, "priority watchlist:", scan.priorityWatchlist.length);
          console.log("Wallet sample inspection:", JSON.stringify(inspection));
          console.log("Policy:", scan.watchlistPolicyVersion);
          NODE
