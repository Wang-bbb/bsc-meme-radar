name: Four.meme Shadow Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fourmeme-shadow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Four.meme shadow module syntax
        run: node --check fourmeme-event-shadow.js
      - name: Run Four.meme shadow tests
        run: node --experimental-default-type=module --test tests/fourmeme-event-shadow.test.mjs
